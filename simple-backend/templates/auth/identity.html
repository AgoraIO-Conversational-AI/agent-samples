<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Identity</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
    .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; text-align: center; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4285F4; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #4285F4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #3367d6; }
    .btn-submit:disabled { background: #999; cursor: not-allowed; }
    .error {
      background: #fef2f2;
      color: #dc2626;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Verify Your Identity</h1>
    <p class="subtitle">We'll send a verification code to your phone</p>

    <div id="error" class="error"></div>

    <form id="identity-form" onsubmit="return handleSubmit(event)">
      <label for="name">First Name</label>
      <input type="text" id="name" name="name" required autocomplete="given-name" placeholder="">

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="+1 555 123 4567">

      <button type="submit" class="btn-submit" id="submit-btn">Send Verification Code</button>
    </form>
  </div>

  <script>
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const form = document.getElementById('identity-form');
      const formData = new FormData(form);

      try {
        const res = await fetch('/auth/send-code', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success && data.redirect) {
          window.location.href = data.redirect;
          return;
        }
        errorEl.textContent = data.error || 'Something went wrong.';
        errorEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'Send Verification Code';
      return false;
    }
  </script>
</body>
</html>
