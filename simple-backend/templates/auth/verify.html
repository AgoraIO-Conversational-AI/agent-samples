<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ brand_name }} | Verify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
    .pin-input {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .pin-input input {
      width: 48px;
      height: 56px;
      text-align: center;
      font-size: 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .pin-input input:focus { border-color: #4285F4; }
    .btn-verify {
      width: 100%;
      padding: 12px;
      background: #4285F4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-verify:hover { background: #3367d6; }
    .btn-verify:disabled { background: #999; cursor: not-allowed; }
    .error {
      background: #fef2f2;
      color: #dc2626;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ brand_name }}</h1>
    <p class="subtitle">We sent a 6-digit code to your phone</p>

    <div id="error" class="error"></div>

    <div class="pin-input" id="pin-container">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>

    <button class="btn-verify" id="verify-btn" onclick="handleVerify()">Verify</button>
  </div>

  <script>
    const inputs = document.querySelectorAll('.pin-input input');
    let attemptedAutoSubmit = false;

    function currentPin() {
      return Array.from(inputs).map(i => i.value).join('');
    }

    function maybeAutoSubmit() {
      if (!attemptedAutoSubmit && currentPin().length === 6) {
        attemptedAutoSubmit = true;
        handleVerify();
      }
    }

    // Auto-advance on input
    inputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }
        maybeAutoSubmit();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
          inputs[idx - 1].focus();
        }
      });
      // Handle paste of full code
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
        for (let i = 0; i < Math.min(text.length, inputs.length); i++) {
          inputs[i].value = text[i];
        }
        if (text.length >= inputs.length) {
          inputs[inputs.length - 1].focus();
        }
        maybeAutoSubmit();
      });
    });

    inputs[0].focus();

    async function handleVerify() {
      const pin = currentPin();
      if (pin.length !== 6) {
        showError('Please enter all 6 digits.');
        return;
      }

      const btn = document.getElementById('verify-btn');
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const formData = new FormData();
        formData.append('pin', pin);
        const res = await fetch('/auth/verify-pin', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success && data.redirect) {
          window.location.href = data.redirect;
          return;
        }
        attemptedAutoSubmit = false;
        showError(data.error || 'Verification failed.');
      } catch (err) {
        attemptedAutoSubmit = false;
        showError('Network error. Please try again.');
      }
      btn.disabled = false;
      btn.textContent = 'Verify';
    }

    function showError(msg) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }
  </script>
</body>
</html>
